{% extends "base.html" %}{% block title %}ثبت‌نام | SMJ{% endblock %}
{% block content %}<section class="auth-section"><form class="auth-card" method="post"><span class="kicker">JOIN SMJ COMMUNITY</span><h1>ساخت حساب</h1><label>نام کاربری<input name="username" minlength="3" required autocomplete="username"></label><label>ایمیل<input type="email" name="email" required autocomplete="email"></label><label>رمز عبور<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="btn full" type="submit">ساخت حساب</button><p>قبلاً ثبت‌نام کردی؟ <a href="{{ url_for('login') }}">وارد شو</a></p></form></section>{% endblock %}
